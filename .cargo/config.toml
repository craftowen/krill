# 하네스(2026-10-15, 2026-11-24 개정):
# 다중 워커 환경에서는 머신 래퍼(CARGO_BUILD_JOBS)가 자리당 코어 수로 제한하고,
# 단독 개발·CI에서는 jobs = 6으로 컴파일 병렬도를 높인다. 필요하면 CARGO_BUILD_JOBS로 덮어쓴다.
[build]
jobs = 6

# 다중 워크트리 디스크 보호 및 sccache 히트율 유지(증분 컴파일은 sccache 캐시 불가)를 위해 기본은 끈다.
# 단독 워크트리에서 빠른 반복 편집이 필요하면 `CARGO_INCREMENTAL=1 RUSTC_WRAPPER=""`로 덮어쓴다.
incremental = false
