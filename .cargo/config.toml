# 하네스(2026-10-15): 워커 10개가 동시에 빌드하면 각자 12개 rustc를 띄워 load 124까지 오른다.
# ponytail: 작업 공간당 4개로 고정, 단독 빌드가 느리면 CARGO_BUILD_JOBS로 덮어쓴다.
[build]
jobs = 4

# 하네스(2026-10-15 19:05): 작업 공간 20여 개 x 증분 캐시로 디스크가 40GB 아래로 내려가 감시가 캐시를 지우고, 빌드 중인 워커가 ENOENT로 실패했다.
# 증분 빌드를 꺼 디스크를 줄인다(재빌드는 조금 느려짐). 단독 개발 때는 CARGO_INCREMENTAL=1로 덮어쓴다.
incremental = false
