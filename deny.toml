# cargo-deny 0.20.2에서 검증(docs/research/C1-final.md §3.4). 실행: cargo deny --locked check
[graph]
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
all-features = false

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = []  # { id = "RUSTSEC-…", reason = "…" } 형식만, 사유 필수

[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
workspace-dependencies = { duplicates = "deny", include-path-dependencies = true, unused = "deny" }
# CONVENTIONS T5: krill-proto·krill-term은 gpui·tokio·nix·objc2에 의존하지 않는다. wrappers = 지금 그 크레이트를
# 직접 의존하는 크레이트 전부(graph.targets 기준. cargo-deny가 `unmatched-wrapper` 경고로 빠진 것을 알려 준다).
# 의존성 갱신으로 새 직접 의존자가 생기면 여기서 걸린다 — proto·term이 아닌지 확인하고 목록에 더한다.
# 한계: proto·term이 이미 wrappers에 있는 크레이트를 새로 의존하면(간접 의존) 잡지 못한다.
deny = [
    { crate = "gpui-pre", reason = "T5", wrappers = ["gpui-base", "gpui-component", "gpui-kit-assets", "gpui-pre-apple", "gpui-pre-macos", "gpui-pre-platform", "gpui-pre-windows", "krill-app"] },
    { crate = "tokio", reason = "T5", wrappers = ["backon", "hyper", "hyper-rustls", "hyper-util", "iroh", "iroh-dns", "iroh-relay", "krill-app", "krill-hosts", "krill-link", "n0-dns-resolver", "n0-future", "netwatch", "noq", "reqwest", "tokio-rustls", "tokio-stream", "tokio-util", "tokio-websockets", "tower"] },
    { crate = "nix", reason = "T5(워크스페이스는 rustix를 쓴다)" },
    { crate = "objc2", reason = "T5", wrappers = ["accesskit_macos", "block2", "dispatch2", "gpui-base", "gpui-component", "gpui-pre-apple", "gpui-pre-macos", "krill-app", "netdev", "objc2-app-kit", "objc2-cloud-kit", "objc2-core-data", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-image", "objc2-core-text", "objc2-core-video", "objc2-core-wlan", "objc2-foundation", "objc2-metal", "objc2-quartz-core", "objc2-security", "objc2-security-foundation", "objc2-system-configuration", "objc2-user-notifications"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = []

# gpui 의존성 때문에 허용 목록 밖 라이선스가 필요한 크레이트만 예외로 둔다(2026-10-15 야간 지휘자 결정, 아침 검토 대상).
# MPL-2.0: 파일 단위 약한 카피레프트 — 수정하지 않고 쓰면 배포 제약 없음. 0BSD·CC0-1.0: 사실상 제약 없음.
[[licenses.exceptions]]
crate = "cbindgen"          # gpui-pre-apple macOS build-dependency(빌드 도구, 배포 바이너리에 안 들어감)
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "option-ext"        # zed-font-kit → dirs → dirs-sys
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "enum-iterator"     # gpui-component
allow = ["0BSD"]
[[licenses.exceptions]]
crate = "enum-iterator-derive"
allow = ["0BSD"]
[[licenses.exceptions]]
crate = "notify"            # gpui-component
allow = ["CC0-1.0"]
# iroh(원격 연결 mk-link, MK-133) — 2026-10-16 오웬 승인. portmapper(attohttpc MPL-2.0)는 기능을 꺼서 들이지 않는다.
# CDLA-Permissive-2.0: Mozilla 루트 인증서 데이터 번들의 퍼미시브 데이터 라이선스(MK-130 iroh 스파이크에서 확인).
[[licenses.exceptions]]
crate = "webpki-roots"      # iroh-relay · iroh-dns → n0-dns-resolver
allow = ["CDLA-Permissive-2.0"]
# M11 Windows 포팅(OWE-812) — 승인됨. Apple+Windows 그래프를 합치면 잡히는 오탐: dwrote는 zed-font-kit → gpui-pre-apple 경유라 실제로 빌드되지 않는다.
[[licenses.exceptions]]
crate = "dwrote"
allow = ["MPL-2.0"]
