<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c1a"><meta name="apple-mobile-web-app-capable" content="yes"><title>Krill · Mobile</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="app.css"><script src="app.js" defer></script></head><body>
<header><a class="wordmark" href="/">MINIKRILL<span>REMOTE</span></a><span id="connection" class="connection" role="status">Connecting…</span></header>
<main><div id="notice" role="alert" hidden></div><section id="needs-you" hidden aria-label="Needs You"><div class="section-heading"><h1>Needs You</h1><span id="needs-count">0</span></div><p>A quick decision keeps your agents moving.</p><div id="urgent-items"></div></section>
<nav aria-label="Mobile views"><button data-tab="sessions" class="active">Sessions</button><button data-tab="orchestration">Orchestration</button><button data-tab="accounts">Accounts</button></nav><div class="page-heading"><h1>Your workspace,<br>within reach.</h1><p>Session updates and decisions from your Mac.</p></div>
<section id="sessions" aria-label="Sessions"></section><section id="orchestration" aria-label="Orchestration" hidden></section><section id="accounts" aria-label="Provider accounts" hidden></section><section id="terminal-panel" aria-label="Live terminal" hidden><div class="section-heading"><h2 id="terminal-title">Live terminal</h2><span id="terminal-status" role="status">Connecting…</span></div><label><input id="fit-phone" type="checkbox"> Fit to Phone</label><div class="history-toolbar"><button type="button" id="load-history">Load earlier rows</button><span id="history-status" role="status">Swipe to load scrollback</span></div><div id="terminal-scroll" tabindex="0"><pre id="terminal-history"></pre><canvas id="terminal-grid" role="img" aria-label="Terminal connecting"></canvas></div></section></main>
<form id="composer"><div class="composer-heading"><span id="selected-session">Select a session</span><span id="attachment-status" role="status"></span></div><div id="keybar" role="toolbar" aria-label="Terminal special keys"></div><label class="sr-only" for="prompt">Prompt</label><textarea id="prompt" rows="2" maxlength="10000" placeholder="Send a prompt to your agent…"></textarea><div class="composer-actions"><div><button type="button" id="pick-photo">＋ Photo</button><button type="button" id="take-photo">Camera</button></div><button type="submit" id="send">Send ↗</button></div><input type="file" id="photo" accept="image/*" hidden><input type="file" id="camera" accept="image/*" capture="environment" hidden></form>
<dialog id="git-dialog"><div class="section-heading"><h2 id="git-title">Git diff</h2><button id="close-git" type="button">Close</button></div><div id="git-files"></div><pre id="git-patch"></pre></dialog>
</body></html>
