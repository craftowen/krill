[package]
name = "krill-holder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
krill-log = { workspace = true }
tracing = { workspace = true }
krill-proto = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }
rustix-openpty = { workspace = true }
libc = { workspace = true }

# ConPTY(Windows 홀더, M11). 기능 목록은 ConPTY 구현 작업이 확정한다.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_Networking_WinSock"] }

[lints]
workspace = true
