[package]
name = "krill-app-shell"
# 내부 라이브러리 크레이트는 고정 버전을 써 릴리스 버전 범프 시 재컴파일·캐시 무효화를 막는다.
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
krill-ui = { workspace = true }
krill-app-core = { workspace = true }
krill-bots-ui = { workspace = true }
krill-hosts = { workspace = true }
krill-link-core = { workspace = true }
krill-log = { workspace = true }
krill-proto = { workspace = true }
krill-term = { workspace = true }
gpui-pre = { workspace = true }
gpui-pre-platform = { workspace = true }
gpui-component = { workspace = true, features = ["tree-sitter-rust"] }
gpui-kit-assets = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
postcard = { workspace = true }
rustix = { workspace = true }
gpui-pre-platform = { workspace = true, features = ["test-support"] }
gpui-pre = { workspace = true, features = ["test-support"] }
krilld = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
rustix-openpty = { workspace = true }
