[package]
name = "krill-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
krill-hosts = { workspace = true }
krill-link = { workspace = true }
tokio = { workspace = true }
krill-log = { workspace = true }
tracing = { workspace = true }
krill-proto = { workspace = true }
krill-term = { workspace = true }
gpui-pre = { workspace = true }
gpui-pre-platform = { workspace = true }
gpui-component = { workspace = true, features = ["tree-sitter-rust"] }
gpui-kit-assets = { workspace = true }
raw-window-handle = { workspace = true }
postcard = { workspace = true }
regex = { workspace = true }
rustix = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
block2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-user-notifications = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_Power", "Win32_System_Threading", "Win32_Security", "Win32_UI_Input_Ime", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
proptest = { workspace = true }
gpui-pre-platform = { workspace = true, features = ["test-support"] }
gpui-pre = { workspace = true, features = ["test-support"] }
krilld = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
rustix-openpty = { workspace = true }
