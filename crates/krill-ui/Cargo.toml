[package]
name = "krill-ui"
# 내부 라이브러리 크레이트는 고정 버전을 써 릴리스 버전 범프 시 재컴파일·캐시 무효화를 막는다.
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
krill-proto = { workspace = true }
krill-term = { workspace = true }
gpui-pre = { workspace = true }
gpui-pre-platform = { workspace = true }
gpui-component = { workspace = true }
gpui-kit-assets = { workspace = true }
image = { workspace = true }
raw-window-handle = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }
objc2 = { workspace = true }
block2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-user-notifications = { workspace = true }

[target.'cfg(windows)'.dependencies]
tokio = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Time", "Win32_Security", "Win32_UI_Input_Ime", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
proptest = { workspace = true }
gpui-pre-platform = { workspace = true, features = ["test-support"] }
gpui-pre = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
