# Windows 네이티브 검사. cfg·import 깨짐(v0.2.46 후보 폐기 등)을 PR에서 잡도록 check 잡은 Rust 변경 PR·main push에도 돈다.
# release app(fxc 셰이더, 약 20분) 빌드는 수동 실행만 한다.
name: ci-windows

on:
  pull_request:
    paths: ['crates/**', 'vendor/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', '.github/workflows/ci-windows.yml']
  push:
    branches: [main]
    paths: ['crates/**', 'vendor/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', '.github/workflows/ci-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: 10

jobs:
  check:
    name: check (MSVC)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Preserve LF before checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust 1.98
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

  build:
    name: release app (fxc shaders)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Preserve LF before checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust 1.98
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"

      - name: Build app and release shaders
        run: cargo build -p krill-app --release --locked
