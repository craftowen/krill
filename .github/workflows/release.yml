name: Release macOS

# 공식 게시 경로는 로컬 맥의 packaging/publish-github.sh다(가드·락·Linux 자산 포함, packaging/README.md).
# 이 워크플로는 수동 예비 경로이고 주 용도는 이미 게시된 릴리스에 Windows·Linux 네이티브 자산을 더하는 것이다.
# publish-github.sh와 같은 규칙: main 끝(또는 이미 있는 태그 커밋)에서만, 기존 자산은 절대 덮어쓰지 않는다.
# Linux tar.gz(x86_64·aarch64)도 무료 네이티브 러너(ubuntu-22.04, ubuntu-22.04-arm)에서 빌드·스모크 검증 후 업로드한다.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 태그 (예: v0.1.2, 비우면 Cargo.toml 버전 기준)'
        required: false
        type: string
      build_only:
        description: '야간 후보의 Windows/Linux 빌드·스모크만 실행 (태그·릴리스 게시 없음)'
        default: false
        type: boolean
      public_key:
        description: 'build_only 후보에 넣을 Ed25519 공개키 (64hex, 비밀키 아님)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    if: ${{ !inputs.build_only }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1

      - name: Resolve release version and URLs
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          CARGO_VER=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          if [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${CARGO_VER}"
          fi
          VERSION="${TAG#v}"
          if [[ "${VERSION}" != "${CARGO_VER}" ]]; then
            echo "tag version (${VERSION}) does not match Cargo.toml (${CARGO_VER})" >&2
            exit 1
          fi
          # 게시 소스 가드: 태그가 있으면 그 커밋, 없으면 origin/main 끝에서만 만든다.
          if TAG_SHA=$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}"); then
            [[ "${TAG_SHA}" == "${GITHUB_SHA}" ]] || { echo "tag ${TAG} points at ${TAG_SHA}, not ${GITHUB_SHA}" >&2; exit 1; }
          else
            MAIN_SHA=$(git rev-parse origin/main)
            [[ "${MAIN_SHA}" == "${GITHUB_SHA}" ]] || { echo "release builds run on origin/main (${MAIN_SHA}), not ${GITHUB_SHA}" >&2; exit 1; }
          fi
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "repo_url=${REPO_URL}"
            echo "source_url=${REPO_URL}/releases/download/${TAG}/Krill-${VERSION}-source.tar.gz"
            echo "dmg_url=${REPO_URL}/releases/download/${TAG}/Krill-${VERSION}.dmg"
          } >> "${GITHUB_OUTPUT}"

      # 업데이트 공개키를 앱에 심으므로 서명 키가 없으면 만들지 않는다(무작위 키가 박힌 앱 방지).
      - name: Require update signing key
        env:
          KRILL_RELEASE_SIGNING_KEY: ${{ secrets.KRILL_RELEASE_SIGNING_KEY }}
        run: |
          [[ -n "${KRILL_RELEASE_SIGNING_KEY}" ]] || { echo "KRILL_RELEASE_SIGNING_KEY secret is required" >&2; exit 1; }

      - name: Build Krill.app and ZIP (MK-061)
        env:
          KRILL_RELEASE_SIGNING_KEY: ${{ secrets.KRILL_RELEASE_SIGNING_KEY }}
        run: bash packaging/bundle.sh

      - name: Build DMG and Homebrew tap (MK-072)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REPO_URL: ${{ steps.meta.outputs.repo_url }}
          SOURCE_URL: ${{ steps.meta.outputs.source_url }}
          DMG_URL: ${{ steps.meta.outputs.dmg_url }}
        run: |
          bash packaging/release.sh \
            "${VERSION}" \
            "${REPO_URL}" \
            "${SOURCE_URL}" \
            "${DMG_URL}" \
            packaging/dist/Krill.app \
            packaging/dist

      - name: Sign latest.json (MK-154)
        env:
          KRILL_RELEASE_SIGNING_KEY: ${{ secrets.KRILL_RELEASE_SIGNING_KEY }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ZIPS=(packaging/dist/Krill-"${VERSION}"-*-adhoc.zip)
          [[ "${#ZIPS[@]}" -eq 1 && -f "${ZIPS[0]}" ]] || { echo "expected exactly one adhoc zip" >&2; exit 1; }
          ZIP_NAME=$(basename "${ZIPS[0]}")
          ZIP_SHA256=$(awk '{print $1}' "${ZIPS[0]}.sha256")
          MIN_DAEMON_PROTO=$(sed -n 's/^pub const PROTO_MIN: u16 = \([0-9][0-9]*\);/\1/p' crates/krill-proto/src/ipc.rs)
          CHANNEL=stable
          if [[ "${VERSION}" == *-* ]]; then CHANNEL=beta; fi
          python3 packaging/macos/ed25519_manifest.py sign \
            --key-file "${RUNNER_TEMP}/unused.key" \
            --version "${VERSION}" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}" \
            --sha256 "${ZIP_SHA256}" \
            --min-daemon-protocol "${MIN_DAEMON_PROTO:-1}" \
            --channel "${CHANNEL}" \
            --rollout-pct 100 \
            --output packaging/dist/latest.json

      - name: Upload Homebrew tap artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-krill-${{ steps.meta.outputs.version }}
          path: packaging/dist/homebrew-krill/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # publish-github.sh의 ASSETS와 같은 목록(Linux tar.gz 제외).
          ASSETS=(
            "packaging/dist/Krill-${VERSION}.dmg"
            packaging/dist/Krill-"${VERSION}"-*-adhoc.zip
            packaging/dist/Krill-"${VERSION}"-*-adhoc.zip.sha256
            "packaging/dist/Krill-${VERSION}-source.tar.gz"
            "packaging/dist/homebrew-krill/SHA256SUMS"
            "packaging/dist/latest.json"
            "packaging/install.sh"
            "packaging/install-linux.sh"
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists (publish-github.sh); signed assets are never overwritten."
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --target "${GITHUB_SHA}" \
              --title "Krill ${TAG}" \
              --generate-notes
          fi

  # OWE-839: Windows zip(packaging/windows). macOS 잡과 needs로 묶지 않아 서로의 빌드 실패에 영향받지 않는다.
  # Authenticode 서명은 OWE-838(유료 인증서, 사람이 결정) 전까지 넣지 않는다.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Preserve LF before checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1

      - name: Resolve release version
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          set -euo pipefail
          CARGO_VER=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          if [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${CARGO_VER}"
          fi
          VERSION="${TAG#v}"
          if [[ "${VERSION}" != "${CARGO_VER}" ]]; then
            echo "tag version (${VERSION}) does not match Cargo.toml (${CARGO_VER})" >&2
            exit 1
          fi
          # 게시 소스 가드: 태그가 있으면 그 커밋, 없으면 origin/main 끝에서만 만든다.
          if TAG_SHA=$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}"); then
            [[ "${TAG_SHA}" == "${GITHUB_SHA}" ]] || { echo "tag ${TAG} points at ${TAG_SHA}, not ${GITHUB_SHA}" >&2; exit 1; }
          elif [[ "${BUILD_ONLY}" != true ]]; then
            MAIN_SHA=$(git rev-parse origin/main)
            [[ "${MAIN_SHA}" == "${GITHUB_SHA}" ]] || { echo "release builds run on origin/main (${MAIN_SHA}), not ${GITHUB_SHA}" >&2; exit 1; }
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      # +crt-static: VCRUNTIME140.dll 의존 제거(docs/research/windows-spike-OWE-837.md §4).
      - name: Restore Windows release dependencies
        id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-windows-msvc-static
          cache-bin: 'false'
          save-if: ${{ inputs.build_only && github.ref == 'refs/heads/release/nightly' }}

      - name: Build release binaries
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p krill-app -p krill -p krilld -p krill-holder -p krill-link

      # ConPTY B안 파일은 저장소에 없다. nupkg 해시를 확인하고, 안의 두 파일 해시는 bundle.ps1이 다시 확인한다.
      - name: Fetch pinned ConPTY package
        shell: powershell
        run: |
          curl.exe -fsSL -o conpty.nupkg https://www.nuget.org/api/v2/package/Microsoft.Windows.Console.ConPTY/1.25.260930003
          $got = (Get-FileHash -Algorithm SHA256 conpty.nupkg).Hash.ToLowerInvariant()
          if ($got -ne '02b07b349af66d801159bdf9e440d4a1ce78bb951f37fc8609731665afdae7ee') { throw "conpty.nupkg sha256 mismatch: $got" }
          New-Item -ItemType Directory conpty | Out-Null
          tar.exe -xf conpty.nupkg -C conpty
          if ($LASTEXITCODE -ne 0) { throw "tar failed: $LASTEXITCODE" }

      # 비밀키는 macOS 매니페스트와 같은 키(ed25519_manifest.py의 KRILL_RELEASE_SIGNING_KEY, 64hex 시드)다.
      # 시크릿이 없으면 공개키 없는 zip(업데이터 꺼짐)만 만들고 latest-windows.json은 건너뛴다.
      - name: Derive update public key
        id: key
        shell: bash
        env:
          KRILL_RELEASE_SIGNING_KEY: ${{ secrets.KRILL_RELEASE_SIGNING_KEY }}
          BUILD_ONLY: ${{ inputs.build_only }}
          INPUT_PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_ONLY}" == true ]]; then
            [[ "${INPUT_PUBLIC_KEY}" =~ ^[0-9a-f]{64}$ ]] || { echo "build_only needs a 64-hex public key" >&2; exit 1; }
            echo "public_key=${INPUT_PUBLIC_KEY}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ -z "${KRILL_RELEASE_SIGNING_KEY}" ]]; then
            echo "::warning::KRILL_RELEASE_SIGNING_KEY is not set; the Windows zip ships without an update key and latest-windows.json is skipped"
            exit 0
          fi
          PUB=$(python packaging/macos/ed25519_manifest.py keygen --key-file "${RUNNER_TEMP}/unused.key")
          [[ "${PUB}" =~ ^[0-9a-f]{64}$ ]] || { echo "failed to derive 64-hex Ed25519 public key" >&2; exit 1; }
          echo "public_key=${PUB}" >> "${GITHUB_OUTPUT}"

      - name: Bundle Windows zip (OWE-837)
        shell: powershell
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PUBLIC_KEY: ${{ steps.key.outputs.public_key }}
        run: |
          $a = @{
            Version   = $env:VERSION
            ConptyDir = 'conpty'
            UpdateUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest-windows.json"
          }
          if ($env:PUBLIC_KEY) { $a.PublicKey = $env:PUBLIC_KEY }
          $line = & .\packaging\windows\bundle.ps1 @a
          Set-Content -Encoding ascii "packaging\dist\Krill-$env:VERSION-windows-x64.zip.sha256" $line
          $line

      # TODO(OWE-838): Authenticode 서명(signtool)은 여기서 zip 전에 exe에 한다. 인증서·비밀은 사람이 정한다.

      - name: Sign latest-windows.json
        if: ${{ !inputs.build_only && steps.key.outputs.public_key != '' }}
        shell: bash
        env:
          KRILL_RELEASE_SIGNING_KEY: ${{ secrets.KRILL_RELEASE_SIGNING_KEY }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ZIP_NAME="Krill-${VERSION}-windows-x64.zip"
          ZIP_SHA256=$(awk '{print $1}' "packaging/dist/${ZIP_NAME}.sha256")
          MIN_DAEMON_PROTO=$(sed -n 's/^pub const PROTO_MIN: u16 = \([0-9][0-9]*\);/\1/p' crates/krill-proto/src/ipc.rs)
          CHANNEL=stable
          if [[ "${VERSION}" == *-* ]]; then CHANNEL=beta; fi
          python packaging/macos/ed25519_manifest.py sign \
            --key-file "${RUNNER_TEMP}/unused.key" \
            --version "${VERSION}" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}" \
            --sha256 "${ZIP_SHA256}" \
            --min-daemon-protocol "${MIN_DAEMON_PROTO:-1}" \
            --channel "${CHANNEL}" \
            --rollout-pct 100 \
            --output packaging/dist/latest-windows.json

      - name: Verify nightly Windows installation and daemon survival
        if: inputs.build_only
        shell: powershell
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          & .\packaging\windows\smoke.ps1 -Zip "packaging\dist\Krill-$env:VERSION-windows-x64.zip"
          git rev-parse HEAD | Set-Content -Encoding ascii packaging/dist/source-commit-windows.txt

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: krill-windows-${{ steps.meta.outputs.version }}
          path: |
            packaging/dist/Krill-${{ steps.meta.outputs.version }}-windows-x64.zip
            packaging/dist/Krill-${{ steps.meta.outputs.version }}-windows-x64.zip.sha256
            packaging/dist/latest-windows.json
            packaging/dist/source-commit-windows.txt
          if-no-files-found: error
          retention-days: 30

  # macOS 잡이 끝난 뒤(성공·실패 무관) 올린다. 먼저 릴리스를 만들어 버리면 macOS 잡이 "이미 있음"으로 업로드를 건너뛰기 때문이다.
  # 이미 있는 자산은 덮어쓰지 않는다. 잘못 올라간 자산은 사람이 지우고 다시 실행한다.
  publish-windows:
    needs: [release, build-windows]
    if: ${{ !inputs.build_only && !cancelled() && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: krill-windows-${{ needs.build-windows.outputs.version }}
          path: dist

      - name: Publish Windows assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build-windows.outputs.tag }}
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          set -euo pipefail
          ASSETS=(dist/*)
          ZIP_NAME="Krill-${VERSION}-windows-x64.zip"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -qxF "${ZIP_NAME}"; then
              echo "Release ${TAG} already has ${ZIP_NAME}; skipping (assets are never overwritten)."
            else
              gh release upload "${TAG}" "${ASSETS[@]}"
            fi
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --target "${GITHUB_SHA}" \
              --title "Krill ${TAG}" \
              --generate-notes
          fi

  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source and native Ubuntu 22.04 runner
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          set -euo pipefail
          CARGO_VER=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          if [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${CARGO_VER}"
          fi
          VERSION="${TAG#v}"
          if [[ "${VERSION}" != "${CARGO_VER}" ]]; then
            echo "tag version (${VERSION}) does not match Cargo.toml (${CARGO_VER})" >&2
            exit 1
          fi
          if TAG_SHA=$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}"); then
            [[ "${TAG_SHA}" == "${GITHUB_SHA}" ]] || { echo "tag ${TAG} points at ${TAG_SHA}, not ${GITHUB_SHA}" >&2; exit 1; }
          elif [[ "${BUILD_ONLY}" != true ]]; then
            MAIN_SHA=$(git rev-parse origin/main)
            [[ "${MAIN_SHA}" == "${GITHUB_SHA}" ]] || { echo "release builds run on origin/main (${MAIN_SHA}), not ${GITHUB_SHA}" >&2; exit 1; }
          fi
          [[ "$(uname -m)" == "${EXPECTED_ARCH}" ]]
          (
            source /etc/os-release
            [[ "${ID}" == ubuntu && "${VERSION_ID}" == 22.04 ]]
          )
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.98.1"

      - name: Restore Linux release dependencies
        id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-linux-${{ matrix.arch }}
          cache-bin: 'false'
          save-if: ${{ inputs.build_only && github.ref == 'refs/heads/release/nightly' }}

      - name: Build native Linux archive
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash packaging/linux/build.sh "${VERSION}" packaging/dist

      - name: Install and verify daemon SIGKILL survival
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bash packaging/linux/smoke.sh "packaging/dist/krill-${VERSION}-linux-${EXPECTED_ARCH}.tar.gz"
          git rev-parse HEAD > "packaging/dist/source-commit-${EXPECTED_ARCH}.txt"

      - name: Upload verified Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: krill-linux-${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          path: |
            packaging/dist/krill-${{ steps.meta.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            packaging/dist/krill-${{ steps.meta.outputs.version }}-linux-${{ matrix.arch }}.tar.gz.sha256
            packaging/dist/source-commit-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30

  publish-linux:
    needs: [release, build-linux]
    if: ${{ !inputs.build_only && !cancelled() && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve release version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          CARGO_VER=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          TAG="${INPUT_TAG:-v${CARGO_VER}}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@v4
        with:
          pattern: krill-linux-${{ steps.meta.outputs.version }}-*
          merge-multiple: true
          path: dist

      - name: Publish Linux assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            [[ "$(cat "dist/source-commit-${arch}.txt")" == "${GITHUB_SHA}" ]]
          done
          ASSETS=(
            "dist/krill-${VERSION}-linux-x86_64.tar.gz"
            "dist/krill-${VERSION}-linux-x86_64.tar.gz.sha256"
            "dist/krill-${VERSION}-linux-aarch64.tar.gz"
            "dist/krill-${VERSION}-linux-aarch64.tar.gz.sha256"
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            EXISTING=$(gh release view "${TAG}" --json assets --jq '.assets[].name')
            TO_UPLOAD=()
            for a in "${ASSETS[@]}"; do
              if ! grep -qxF "$(basename "$a")" <<<"${EXISTING}"; then
                TO_UPLOAD+=("$a")
              fi
            done
            if [[ "${#TO_UPLOAD[@]}" -gt 0 ]]; then
              gh release upload "${TAG}" "${TO_UPLOAD[@]}"
            else
              echo "Release ${TAG} already has all Linux assets; skipping."
            fi
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --target "${GITHUB_SHA}" \
              --title "Krill ${TAG}" \
              --generate-notes
