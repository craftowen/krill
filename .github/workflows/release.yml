name: Windows packaged smoke diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaged-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download verified published v0.1.23 package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fLsS -o previous.zip https://github.com/craftowen/krill/releases/download/v0.1.23/Krill-0.1.23-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          $wanted = 'f7fc23186f048bb2dadfebd019ce255677ea150aba9c992d49a778de402f71d8'
          if ((Get-FileHash previous.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $wanted) { throw 'Published ZIP checksum mismatch' }
      - name: Run full packaged smoke outside runner Job
        shell: powershell
        run: .\packaging\windows\smoke-ci.ps1 -Zip previous.zip
