name: Packaging signing diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compare temporary certificate selectors and search scope
        run: python3 packaging/macos/diagnose_keychain.py
