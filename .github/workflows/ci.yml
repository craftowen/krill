# Repository hygiene only. Product builds run on macOS ARM and Windows.
name: ci

on:
  push:
    # dev push는 개발 중 부분 검사로 진행한다. 전체 CI는 야간 후보·main·PR에만 실행한다.
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-hygiene-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: 10

jobs:
  reuse:
    name: reuse-hygiene-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.proof.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: proof
        name: Verify same-SHA candidate validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/ci_evidence.py reuse --workflow ci.yml

  hygiene:
    name: hygiene
    needs: reuse
    if: needs.reuse.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified gitleaks 8.30.1
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '>=22.13.0 <23'
      - name: Non-Cargo regressions
        run: python3 scripts/check-regressions.py

      - name: Public surface and reachable history
        run: |
          bash scripts/public-surface.sh
          gitleaks git . --log-opts='HEAD --full-history' --config .gitleaks.toml \
            --redact=100 --ignore-gitleaks-allow --no-banner --exit-code 1 \
            --gitleaks-ignore-path "$RUNNER_TEMP/krill-no-ignore"

  ci:
    name: ci
    needs: [reuse, hygiene]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Required validation result
        env:
          PROOF: ${{ needs.reuse.result }}
          REUSED: ${{ needs.reuse.outputs.reuse }}
          HYGIENE: ${{ needs.hygiene.result }}
        run: |
          [ "$PROOF" = success ]
          if [ "$REUSED" = true ]; then [ "$HYGIENE" = skipped ]; else [ "$HYGIENE" = success ]; fi
