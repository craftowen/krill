# Repository hygiene only. Product builds run on macOS ARM and Windows.
name: ci

on:
  push:
    # dev push는 개발 중 부분 검사로 진행한다. 전체 CI는 야간 후보·main·PR에만 실행한다.
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-hygiene-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: 10

jobs:
  reuse:
    name: reuse-hygiene-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.proof.outputs.reuse }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: proof
        name: Verify same-SHA candidate validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/ci_evidence.py reuse --workflow ci.yml

  hygiene:
    name: hygiene
    needs: reuse
    if: needs.reuse.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Release pipeline regressions
        run: |
          python3 packaging/test_ci_evidence.py
          python3 packaging/test_release_check.py
          python3 packaging/test_release_verify.py
          python3 packaging/test_nightly.py
          python3 packaging/test_publish.py

      - name: Public surface
        run: bash scripts/public-surface.sh

  ci:
    name: ci
    needs: [reuse, hygiene]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Required validation result
        env:
          PROOF: ${{ needs.reuse.result }}
          REUSED: ${{ needs.reuse.outputs.reuse }}
          HYGIENE: ${{ needs.hygiene.result }}
        run: |
          [ "$PROOF" = success ]
          if [ "$REUSED" = true ]; then [ "$HYGIENE" = skipped ]; else [ "$HYGIENE" = success ]; fi
