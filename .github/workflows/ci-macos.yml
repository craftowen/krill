# Krill CI — macOS 전체 게이트 (OWE-382, MK-017).
# clippy · nextest(PTY e2e 포함)를 전체 워크스페이스에 실행한다.
# macOS 분 절약을 위해 테스트 입력이 바뀔 때만 macOS 잡을 돌린다. `paths` 필터를 쓰면
# 문서만 바뀐 PR에서 워크플로 자체가 안 떠 required check가 영원히 대기하므로,
# 항상 뜨는 `changes` 잡(ubuntu)이 git diff로 판단하고 고정 이름 `ci-macos` 잡이 결과를 모은다.
# branch protection의 required check에는 `ci-macos`만 건다(matrix 잡 이름은 skip 시 펼쳐지지 않는다).
# dev push는 경량 스모크(cargo check)와 의존성 캐시 워밍을 실행해 dev 대상 PR의 캐시 히트를 보장하고
# PR 간 의미 충돌을 머지 직후 즉시 탐지한다. 전체 CI는 PR·야간 후보·main에서 실행한다.
# 저장소 검사는 ci.yml, 제품 전체·네이티브 패키징 검사는 이 워크플로가 담당한다.
name: ci-macos

on:
  push:
    branches: [dev, main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: 10

jobs:
  reuse:
    name: reuse-macos-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.proof.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: proof
        name: Verify same-SHA candidate validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/ci_evidence.py reuse --workflow ci-macos.yml

  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request는 병합 커밋을 체크아웃하므로 HEAD^1이 base 끝이다.
          fetch-depth: 2
          persist-credentials: false

      - name: 테스트 입력 변경 감지
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          # 빌드·테스트가 읽는 저장소 파일 전체. 근거(2026-10-19 전수 확인):
          #   rg -n 'include_str!|include_bytes!|read_to_string|CARGO_MANIFEST_DIR|\.\./\.\.' crates
          #   - docs/ARCHITECTURE.md: krill-proto ipc/tests.rs include_str!
          #   - docs/STYLEGUIDE.md·AGENTS.md·docs/CONVENTIONS.md·CONTRIBUTING.md·README.md: krill-app ui/theme.rs 문서 동기화 테스트
          #   - packaging/macos/ed25519_manifest.py: krill-app updater/tests.rs·shell/popout/tests.rs가 실행
          #   - vendor/**: krill-app tests/i18n.rs include_str!, krill-proto build.rs 해시, [patch] 소스
          #   - .config/**(nextest 프로필)·.cargo/**(빌드 설정)·루트 Cargo/lint 설정·scripts/check.sh
          re='^(crates/|vendor/|\.config/|\.cargo/|\.github/workflows/|Cargo\.(toml|lock)$|(deny|clippy|rustfmt)\.toml$|scripts/check\.sh$|AGENTS\.md$|CONTRIBUTING\.md$|README\.md$|docs/(ARCHITECTURE|CONVENTIONS|STYLEGUIDE)\.md$|packaging/)'
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE; git fetch -q --depth=1 origin "$BEFORE" || base= ;;
            *) base= ;;
          esac
          # 수동 실행·새 브랜치(before=000…)·강제 푸시 등 diff를 못 구하면 항상 검사한다.
          if [ -z "$base" ] || ! files=$(git diff --name-only "$base" HEAD); then
            echo "base 없음 → 검사"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if hits=$(grep -E "$re" <<<"$files"); then
            printf '테스트 입력 변경:\n%s\n' "$hits"
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "테스트 입력 변경 없음 → macOS 잡 건너뜀"
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  # dev 머지 직후 경량 컴파일 스모크로 PR 간 의미 충돌을 즉시 잡고,
  # refs/heads/dev 스코프에 macOS 의존성 캐시를 유지해 dev 대상 PR의 콜드 빌드를 방지한다.
  dev-smoke:
    name: smoke & cache warm (macos-15)
    needs: [changes, reuse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.changes.outputs.rust == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust 1.98 + clippy
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy

      - name: nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest

      - name: Stage cacheable vendored dependencies
        id: vendor
        run: |
          python3 packaging/vendor_cache.py stage --case producer \
            --cargo-home "$CARGO_HOME" --vendor-root /tmp/krill-ci-vendor \
            --directory "$RUNNER_TEMP/vendor-cache"

      - name: Restore and warm Rust dependencies
        id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v1-vendor-${{ steps.vendor.outputs.vendor-hash }}-${{ steps.vendor.outputs.sdk }}-${{ steps.vendor.outputs.image }}-${{ hashFiles('packaging/vendor_cache.py') }}
          shared-key: ci-macos-15
          cache-directories: ${{ steps.vendor.outputs.vendor-directory }}
          cache-bin: 'false'
          cache-on-failure: true
          save-if: 'true'

      - name: Verify restored vendor and external configuration
        run: python3 packaging/vendor_cache.py verify --directory "$RUNNER_TEMP/vendor-cache"

      - name: Smoke check workspace
        run: cargo check --workspace --all-targets --locked
        timeout-minutes: 30

      - name: Warm test dependency cache when key missed
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo nextest run --profile ci --workspace --locked --no-tests=pass --cargo-profile test --no-run
        timeout-minutes: 75

  packaging:
    name: packaging regressions (macos-15)
    needs: [changes, reuse]
    if: (github.event_name != 'push' || github.ref != 'refs/heads/dev') && needs.changes.outputs.rust == 'true' && needs.reuse.outputs.reuse != 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Packaging regression tests
        run: |
          python3 packaging/macos/test_pipeline.py
          python3 packaging/homebrew/test_release.py

  check:
    name: clippy · nextest (${{ matrix.os }})
    needs: [changes, reuse]
    if: (github.event_name != 'push' || github.ref != 'refs/heads/dev') && needs.changes.outputs.rust == 'true' && needs.reuse.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    # 테스트 프로필 최적화 수준([profile.test] + [profile.test.package."*"] + krilld/krill-term)은
    # 루트 Cargo.toml이 단일 진실원천이다. env로 CARGO_PROFILE_TEST_OPT_LEVEL을 덮어쓰지 않는다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust 1.98 + clippy
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy

      - name: nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest,cargo-deny

      - name: Stage cacheable vendored dependencies
        id: vendor
        run: |
          python3 packaging/vendor_cache.py stage --case producer \
            --cargo-home "$CARGO_HOME" --vendor-root /tmp/krill-ci-vendor \
            --directory "$RUNNER_TEMP/vendor-cache"

      - name: Restore Rust dependencies
        id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: v1-vendor-${{ steps.vendor.outputs.vendor-hash }}-${{ steps.vendor.outputs.sdk }}-${{ steps.vendor.outputs.image }}-${{ hashFiles('packaging/vendor_cache.py') }}
          shared-key: ci-${{ matrix.os }}
          cache-directories: ${{ steps.vendor.outputs.vendor-directory }}
          cache-bin: 'false'
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/nightly') }}

      - name: Verify restored vendor and external configuration
        run: python3 packaging/vendor_cache.py verify --directory "$RUNNER_TEMP/vendor-cache"

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        timeout-minutes: 60

      - name: nextest
        # PTY e2e(krill-holder survive, krill CLI 실PTY 테스트, krilld 통합) 포함.
        run: cargo nextest run --profile ci --workspace --locked --no-tests=pass --cargo-profile test --timings
        timeout-minutes: 120

      - name: FLAKY report (unknown flaky passes fail)
        if: always() && hashFiles('target/nextest/ci/junit.xml') != ''
        run: python3 packaging/ci_evidence.py flaky

      - name: Preserve test and build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
            target/cargo-timings/
          if-no-files-found: warn
          retention-days: 14

  # 새 캐시 저장 후 구버전 중복 캐시를 정리해 저장소 10 GiB 한도 초과로 인한 축출을 막는다.
  prune-caches:
    name: prune stale caches
    needs: [check, dev-smoke]
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/release/nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prune superseded Rust caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/ci_cache_prune.py

  # required check용 고정 이름 잡. macOS 잡들의 성공 또는 의도된 생략만 허용한다.
  ci-macos:
    name: ci-macos
    needs: [changes, check, packaging, dev-smoke, reuse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 결과 집계
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
          PACKAGING: ${{ needs.packaging.result }}
          DEV_SMOKE: ${{ needs.dev-smoke.result }}
          DEV_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
          PROOF: ${{ needs.reuse.result }}
          REUSED: ${{ needs.reuse.outputs.reuse }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
        run: |
          echo "changes=$CHANGES check=$CHECK packaging=$PACKAGING dev_smoke=$DEV_SMOKE dev_push=$DEV_PUSH proof=$PROOF reuse=$REUSED rust=$RUST_CHANGED"
          [ "$CHANGES" = success ]
          [ "$PROOF" = success ]
          case "$DEV_PUSH:$REUSED:$RUST_CHANGED" in
            true:false:true)
              [ "$DEV_SMOKE" = success ]
              [ "$CHECK" = skipped ]
              [ "$PACKAGING" = skipped ]
              ;;
            true:false:false|false:true:true|false:true:false|false:false:false)
              [ "$DEV_SMOKE" = skipped ]
              [ "$CHECK" = skipped ]
              [ "$PACKAGING" = skipped ]
              ;;
            false:false:true)
              [ "$DEV_SMOKE" = skipped ]
              [ "$CHECK" = success ]
              [ "$PACKAGING" = success ]
              ;;
            *) exit 1 ;;
          esac
