# Manual/experiment-branch measurements do not satisfy release evidence.
name: Compare macOS vendor cache
run-name: Compare vendor cache · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: ['experiment/vendor-cache-*']

permissions:
  contents: read

concurrency:
  group: compare-vendor-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control:
    uses: ./.github/workflows/measure-vendor-cache-macos.yml
    with:
      case: control
      cache-prefix: vendor-experiment-${{ github.run_id }}-${{ github.run_attempt }}
  producer:
    uses: ./.github/workflows/measure-vendor-cache-macos.yml
    with:
      case: producer
      cache-prefix: vendor-experiment-${{ github.run_id }}-${{ github.run_attempt }}
  consumer:
    needs: producer
    uses: ./.github/workflows/measure-vendor-cache-macos.yml
    with:
      case: consumer
      cache-prefix: vendor-experiment-${{ github.run_id }}-${{ github.run_attempt }}
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified gitleaks 8.30.1
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Regression tests
        run: |
          python3 packaging/test_vendor_cache.py
          python3 packaging/test_cgu_compare.py
          python3 packaging/test_ci_evidence.py
      - name: Public surface and reachable history
        run: |
          bash scripts/public-surface.sh
          gitleaks git . --log-opts='HEAD --full-history' --config .gitleaks.toml \
            --redact=100 --ignore-gitleaks-allow --no-banner --exit-code 1 \
            --gitleaks-ignore-path "$RUNNER_TEMP/krill-no-ignore"
  compare:
    needs: [control, producer, consumer, hygiene]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require validation jobs
        env:
          CONTROL: ${{ needs.control.result }}
          PRODUCER: ${{ needs.producer.result }}
          CONSUMER: ${{ needs.consumer.result }}
          HYGIENE: ${{ needs.hygiene.result }}
        run: |
          test "$CONTROL" = success
          test "$PRODUCER" = success
          test "$CONSUMER" = success
          test "$HYGIENE" = success
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: vendor-cache-*-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vendor-results
      - name: Compare complete matching evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/vendor-jobs.json"
          python3 packaging/vendor_cache.py compare --directory "$RUNNER_TEMP/vendor-results" \
            --jobs "$RUNNER_TEMP/vendor-jobs.json" >> "$GITHUB_STEP_SUMMARY"
