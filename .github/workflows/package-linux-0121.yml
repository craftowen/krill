name: Package Linux v0.1.21 (native)

on:
  push:
    branches: [automation/linux-package-0.1.21]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: /Volumes/krill-build/targets/linux-0121-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0eaeba4af9fec25e12038dae4bc4d611c37a2f9e
          persist-credentials: false

      - name: Verify source and native Ubuntu 22.04 runner
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == 0eaeba4af9fec25e12038dae4bc4d611c37a2f9e ]]
          [[ "$(uname -m)" == "$EXPECTED_ARCH" ]]
          source /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 22.04 ]]
          ldd --version | head -n 1
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config
          sudo mkdir -p "$CARGO_TARGET_DIR"
          sudo chown "$(id -u):$(id -g)" "$CARGO_TARGET_DIR"
          # build.sh reads target/release; only this ignored link lives in the checkout.
          ln -s "$CARGO_TARGET_DIR" target

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1

      - name: Build native Linux archive
        run: bash packaging/linux/build.sh 0.1.21 packaging/dist

      - name: Install and verify daemon SIGKILL survival
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bash packaging/linux/smoke.sh "packaging/dist/krill-0.1.21-linux-$EXPECTED_ARCH.tar.gz"
          git rev-parse HEAD > "packaging/dist/source-commit-$EXPECTED_ARCH.txt"

      - name: Upload verified Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: krill-linux-0.1.21-${{ matrix.arch }}
          path: |
            packaging/dist/krill-0.1.21-linux-${{ matrix.arch }}.tar.gz
            packaging/dist/krill-0.1.21-linux-${{ matrix.arch }}.tar.gz.sha256
            packaging/dist/source-commit-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 7
